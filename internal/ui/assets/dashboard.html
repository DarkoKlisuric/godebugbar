<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoDebugBar Profiler</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--gdb-bg); color: var(--gdb-text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; }
    a { color: var(--gdb-accent); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--gdb-panel); border-bottom: 1px solid var(--gdb-border); flex-wrap: wrap; }
    .brand { font-size: 15px; font-weight: 700; color: var(--gdb-accent); }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    button, input, select { background: #1e293b; color: var(--gdb-text); border: 1px solid #334155; border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 12px; }
    button { cursor: pointer; }
    button:hover, button:focus-visible, input:focus-visible { border-color: var(--gdb-accent); outline: none; }
    button[aria-pressed="true"] { border-color: var(--gdb-accent); background: #1e3a5f; }
    .conn { font-size: 11px; color: var(--gdb-muted); }
    #minms { width: 80px; }
    .flags { display: inline-flex; gap: 4px; }
    .chips { display: inline-flex; gap: 4px; }
    .chip { white-space: nowrap; font-size: 10px; padding: 0 5px; border-radius: 3px; background: #713f12; color: #fde047; }
    .chip.red { background: #7f1d1d; color: #fca5a5; }
    .conn.error { color: var(--gdb-red); }
    .layout { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; flex: 1; min-height: 0; }
    .sidebar { border-right: 1px solid var(--gdb-border); overflow-y: auto; background: var(--gdb-bg); }
    .req { padding: 9px 12px; border-bottom: 1px solid var(--gdb-border); cursor: pointer; display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; background: none; border-radius: 0; border-width: 0 0 1px 0; }
    .req:hover, .req.active, .req:focus-visible { background: #162238; }
    .req-top, .req-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .req-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .method { font-weight: 700; color: var(--gdb-accent); margin-right: 6px; }
    .req-meta { color: var(--gdb-muted); font-size: 11px; }
    .dots { display: inline-flex; gap: 3px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #334155; }
    .dot.green { background: var(--gdb-green); }
    .dot.yellow { background: var(--gdb-yellow); }
    .dot.red { background: var(--gdb-red); }
    .status { padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; }
    .status.s1, .status.s3 { background: #1e3a5f; color: #93c5fd; }
    .status.s2 { background: #14532d; color: #86efac; }
    .status.s4 { background: #713f12; color: #fde047; }
    .status.s5 { background: #7f1d1d; color: #fca5a5; }
    .main { overflow-y: auto; padding: 16px 22px; }
    .summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .summary h1 { font-size: 15px; margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .summary .meta { color: var(--gdb-muted); font-size: 11px; margin-top: 4px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--gdb-border); padding-bottom: 10px; flex-wrap: wrap; }
    .tab { border-left-width: 3px; }
    .tab.green { border-left-color: var(--gdb-green); }
    .tab.yellow { border-left-color: var(--gdb-yellow); }
    .tab.red { border-left-color: var(--gdb-red); }
    .tab[aria-selected="true"] { background: #1e3a5f; border-top-color: var(--gdb-accent); border-right-color: var(--gdb-accent); border-bottom-color: var(--gdb-accent); }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; height: auto; } .sidebar { max-height: 40vh; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">GoDebugBar Profiler</div>
    <div class="controls">
      <input id="filter" type="search" placeholder="Search path, route, SQL, error or id…" aria-label="Search requests" />
      <select id="method" aria-label="Method"><option value="">Any method</option><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select>
      <select id="status" aria-label="Status"><option value="">Any status</option><option value="2">2xx</option><option value="3">3xx</option><option value="4">4xx</option><option value="5">5xx</option></select>
      <input id="minms" type="number" min="0" step="10" placeholder="min ms" aria-label="Minimum duration in ms" />
      <span class="flags" role="group" aria-label="Only requests with">
        <button type="button" class="flag" data-flag="error" aria-pressed="false">Errors</button>
        <button type="button" class="flag" data-flag="slow" aria-pressed="false">Slow SQL</button>
        <button type="button" class="flag" data-flag="n_plus_one" aria-pressed="false">N+1</button>
        <button type="button" class="flag" data-flag="duplicate" aria-pressed="false">Duplicates</button>
      </span>
      <button id="live" type="button" aria-pressed="true" title="Pause or resume auto-refresh">Live</button>
      <button id="refresh" type="button">Refresh</button>
      <span id="conn" class="conn" role="status"></span>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="list" aria-label="Recorded requests"></nav>
    <main class="main" id="detail"></main>
  </div>
  <script src="{{BASE_URL}}/assets/render.js"></script>
  <script>
    (() => {
      'use strict';

      const R = window.GoDebugBarRender;
      const { h } = R;
      const baseUrl = '{{BASE_URL_JS}}';
      const POLL_MS = 3000;
      const MAX_PROFILES = 200;
      const apiOrigin = new URL(baseUrl, window.location.href).origin;

      document.documentElement.setAttribute('style', R.theme);
      document.head.appendChild(h('style', { text: R.css }));

      const listEl = document.getElementById('list');
      const detailEl = document.getElementById('detail');
      const filterEl = document.getElementById('filter');
      const liveBtn = document.getElementById('live');
      const refreshBtn = document.getElementById('refresh');
      const connEl = document.getElementById('conn');

      let profiles = [];
      let selected = null;
      let activeSection = '';
      let live = true;
      let timer = null;

      const setConnection = (error) => {
        connEl.textContent = error ? `API unreachable: ${error.message}` : (live ? '' : 'paused');
        connEl.classList.toggle('error', !!error);
      };

      const methodEl = document.getElementById('method');
      const statusEl = document.getElementById('status');
      const minMsEl = document.getElementById('minms');
      const flagEls = [...document.querySelectorAll('.flag')];

      const filterParams = () => {
        const params = new URLSearchParams();
        if (filterEl.value.trim()) params.set('q', filterEl.value.trim());
        if (methodEl.value) params.set('method', methodEl.value);
        if (statusEl.value) params.set('status', statusEl.value);
        if (minMsEl.value) params.set('min_ms', minMsEl.value);
        const flags = flagEls.filter((b) => b.getAttribute('aria-pressed') === 'true').map((b) => b.dataset.flag);
        if (flags.length) params.set('has', flags.join(','));
        return params;
      };

      const restoreFilters = () => {
        const params = new URLSearchParams(window.location.search);
        filterEl.value = params.get('q') || '';
        methodEl.value = params.get('method') || '';
        statusEl.value = params.get('status') || '';
        minMsEl.value = params.get('min_ms') || '';
        const flags = (params.get('has') || '').split(',');
        flagEls.forEach((b) => b.setAttribute('aria-pressed', String(flags.includes(b.dataset.flag))));
      };

      const syncURL = () => {
        const url = new URL(window.location.href);
        ['q', 'method', 'status', 'min_ms', 'has'].forEach((key) => url.searchParams.delete(key));
        filterParams().forEach((value, key) => url.searchParams.set(key, value));
        window.history.replaceState(null, '', url);
      };

      const flagChips = (s) => [
        s.panic || s.errors || s.failed_queries ? h('span', { className: 'chip red', text: s.panic ? 'panic' : 'error' }) : null,
        s.slow_queries ? h('span', { className: 'chip', text: `${s.slow_queries} slow` }) : null,
        s.n_plus_one ? h('span', { className: 'chip', text: 'N+1' }) : null,
        s.duplicate_queries ? h('span', { className: 'chip', text: 'dup' }) : null,
      ];

      const renderList = () => {
        listEl.textContent = '';
        if (!profiles.length) {
          listEl.appendChild(h('div', { className: 'gdb-empty', text: filterParams().toString() ? 'No request matches the search.' : 'No recorded requests yet.' }));
          return;
        }
        profiles.forEach((p) => {
          const row = h('button', {
            className: `req${selected && selected.id === p.id ? ' active' : ''}`,
            attrs: { type: 'button', 'aria-current': selected && selected.id === p.id ? 'true' : false, title: p.route || p.path },
            on: { click: () => select(p.id) },
          },
          h('div', { className: 'req-top' },
            h('span', { className: 'req-path' }, h('span', { className: 'method', text: p.method }), p.path),
            h('span', { className: `status ${R.statusClass(p.status)}`, text: p.status })),
          h('div', { className: 'req-meta' },
            h('span', { text: `${R.formatMs(p.duration_ms)} · ${(p.stats && p.stats.queries) || 0} queries · ${new Date(p.created_at).toLocaleTimeString()}` }),
            h('span', { className: 'chips' }, flagChips(p.stats || {})),
            h('span', { className: 'dots' }, (p.badges || []).map((b) => h('span', { className: `dot ${b.color || ''}`, attrs: { title: `${b.label}: ${b.value}` } })))));
          listEl.appendChild(row);
        });
      };

      const actionButton = (label, handler) => {
        const button = h('button', { text: label, attrs: { type: 'button' } });
        button.addEventListener('click', () => handler(button));
        return button;
      };

      const download = (profile) => {
        const blob = new Blob([JSON.stringify(profile, null, 2)], { type: 'application/json' });
        const link = h('a', { attrs: { href: URL.createObjectURL(blob), download: `godebugbar-${profile.id}.json` } });
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      };

      const renderDetail = () => {
        detailEl.textContent = '';
        if (!selected) {
          detailEl.appendChild(h('div', { className: 'gdb-empty', text: 'Select a recorded request to inspect its profile.' }));
          return;
        }
        const sections = selected.sections || [];
        if (!sections.some((s) => s.name === activeSection)) activeSection = sections.length ? sections[0].name : '';

        detailEl.appendChild(h('div', { className: 'summary' },
          h('div', {},
            h('h1', {}, h('span', { className: 'method', text: selected.method }), selected.path,
              h('span', { className: `status ${R.statusClass(selected.status)}`, text: selected.status })),
            h('div', { className: 'meta', text: `${selected.route ? `route ${selected.route} · ` : ''}${R.formatMs(selected.duration_ms)} · ${selected.size} B · ${new Date(selected.created_at).toLocaleString()} · ${selected.id}` })),
          h('div', { className: 'controls' },
            actionButton('Copy as cURL', (b) => R.copyText(R.curl(selected, apiOrigin)).then((ok) => R.flash(b, ok ? 'Copied' : 'Copy failed'))),
            actionButton('Copy link', (b) => R.copyText(window.location.href).then((ok) => R.flash(b, ok ? 'Copied' : 'Copy failed'))),
            actionButton('Export JSON', () => download(selected)))));

        const tabs = h('div', { className: 'tabs', attrs: { role: 'tablist' } });
        sections.forEach((s) => {
          const item = s.toolbar || {};
          tabs.appendChild(h('button', {
            className: `tab ${item.color || ''}`,
            text: `${item.label || s.name}: ${item.value || ''}`,
            attrs: { type: 'button', role: 'tab', 'aria-selected': s.name === activeSection ? 'true' : 'false', title: R.tooltip(item) },
            on: { click: () => { activeSection = s.name; renderDetail(); } },
          }));
        });
        detailEl.appendChild(tabs);

        const section = sections.find((s) => s.name === activeSection);
        const body = h('div', { attrs: { role: 'tabpanel' } });
        detailEl.appendChild(body);
        R.renderWidgets(body, (section && section.panel && section.panel.widgets) || [], {
          explainable: selected.explainable,
          onExplain: R.explainer(baseUrl, selected.id),
        });
      };

      const select = async (id) => {
        try {
          selected = await R.fetchJSON(`${baseUrl}/api/profiles/${encodeURIComponent(id)}`);
          const url = new URL(window.location.href);
          url.searchParams.set('id', id);
          window.history.replaceState(null, '', url);
          setConnection(null);
        } catch (err) {
          selected = null;
          detailEl.textContent = '';
          detailEl.appendChild(h('div', { className: 'gdb-empty', text: `Profile ${id} is not available: ${err.message}. It may have been evicted from the store.` }));
          renderList();
          return;
        }
        renderList();
        renderDetail();
      };

      const poll = async (full) => {
        try {
          const params = filterParams();
          if (!full && profiles.length) params.set('since', profiles[0].id);
          const query = params.toString();
          const fresh = await R.fetchJSON(`${baseUrl}/api/profiles${query ? `?${query}` : ''}`);
          profiles = full ? fresh : [...fresh, ...profiles].slice(0, MAX_PROFILES);
          setConnection(null);
          renderList();
        } catch (err) {
          setConnection(err);
        }
      };

      const schedule = () => {
        clearInterval(timer);
        timer = null;
        if (live && !document.hidden) timer = setInterval(() => poll(false), POLL_MS);
      };

      liveBtn.addEventListener('click', () => {
        live = !live;
        liveBtn.setAttribute('aria-pressed', String(live));
        liveBtn.textContent = live ? 'Live' : 'Paused';
        setConnection(null);
        schedule();
      });
      refreshBtn.addEventListener('click', () => poll(true));
      let searchTimer = null;
      const search = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { syncURL(); poll(true); }, 250);
      };
      [filterEl, minMsEl].forEach((el) => el.addEventListener('input', search));
      [methodEl, statusEl].forEach((el) => el.addEventListener('change', search));
      flagEls.forEach((b) => b.addEventListener('click', () => {
        b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
        search();
      }));
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && live) poll(false);
        schedule();
      });
      listEl.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
        const rows = [...listEl.querySelectorAll('.req')];
        const index = rows.indexOf(document.activeElement);
        const next = rows[index + (event.key === 'ArrowDown' ? 1 : -1)];
        if (next) { event.preventDefault(); next.focus(); next.click(); }
      });

      const start = async () => {
        restoreFilters();
        await poll(true);
        const wanted = new URLSearchParams(window.location.search).get('id');
        if (wanted) await select(wanted);
        else if (profiles.length) await select(profiles[0].id);
        else renderDetail();
        schedule();
      };
      start();
    })();
  </script>
</body>
</html>
