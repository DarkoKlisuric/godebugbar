<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GoDebugBar Profiler</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 0 42px 0;
      background: #090d16;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button, input {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 12px;
    }
    button { cursor: pointer; }
    button:hover { border-color: #38bdf8; }
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: calc(100vh - 85px);
    }
    .sidebar {
      border-right: 1px solid #1e293b;
      overflow-y: auto;
      background: #0b1120;
    }
    .req-item {
      padding: 10px 14px;
      border-bottom: 1px solid #1e293b;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .req-item:hover, .req-item.active {
      background: #162238;
    }
    .req-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .method {
      font-weight: 700;
      color: #38bdf8;
    }
    .status {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
    }
    .status.s2 { background: #14532d; color: #86efac; }
    .status.s4 { background: #713f12; color: #fde047; }
    .status.s5 { background: #7f1d1d; color: #fca5a5; }
    .req-meta {
      color: #94a3b8;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
    }
    .main {
      overflow-y: auto;
      padding: 18px 24px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 6px 12px;
      border-radius: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      cursor: pointer;
    }
    .tab.active {
      background: #1e3a5f;
      border-color: #38bdf8;
    }
    .metrics {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .metric {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 14px;
      min-width: 140px;
    }
    .metric-label { color: #94a3b8; font-size: 11px; }
    .metric-val { font-size: 16px; font-weight: 700; margin-top: 4px; }
    .widget-title {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin: 16px 0 8px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      background: #0f172a;
      border: 1px solid #1e293b;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid #1e293b;
      vertical-align: top;
      word-break: break-all;
    }
    th { color: #94a3b8; width: 220px; background: #111a2e; }
    pre {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
    }
    .empty {
      color: #64748b;
      padding: 40px 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">GoDebugBar Profiler</div>
    <div class="controls">
      <input id="filter" type="text" placeholder="Filter path or method..." />
      <button id="refresh">Refresh</button>
    </div>
  </header>
  <div class="layout">
    <div class="sidebar" id="list"></div>
    <div class="main" id="detail">
      <div class="empty">Select a recorded request to inspect its profile.</div>
    </div>
  </div>
  <script>
    (function () {
      var baseUrl = "{{BASE_URL}}";
      var listEl = document.getElementById("list");
      var detailEl = document.getElementById("detail");
      var filterEl = document.getElementById("filter");
      var refreshBtn = document.getElementById("refresh");

      var profiles = [];
      var selected = null;
      var activeSection = null;

      function statusClass(code) {
        if (code >= 500) return "s5";
        if (code >= 400) return "s4";
        return "s2";
      }

      function renderList() {
        var q = (filterEl.value || "").toLowerCase();
        listEl.textContent = "";
        var filtered = profiles.filter(function (p) {
          return !q || (p.path && p.path.toLowerCase().indexOf(q) !== -1) || (p.method && p.method.toLowerCase().indexOf(q) !== -1);
        });
        if (!filtered.length) {
          var emp = document.createElement("div");
          emp.className = "empty";
          emp.textContent = "No recorded requests yet.";
          listEl.appendChild(emp);
          return;
        }
        filtered.forEach(function (p) {
          var row = document.createElement("div");
          row.className = "req-item" + (selected && selected.id === p.id ? " active" : "");
          var top = document.createElement("div");
          top.className = "req-top";
          var left = document.createElement("span");
          var m = document.createElement("span");
          m.className = "method";
          m.textContent = p.method + " ";
          var pathSpan = document.createElement("span");
          pathSpan.textContent = p.path;
          left.appendChild(m);
          left.appendChild(pathSpan);
          var st = document.createElement("span");
          st.className = "status " + statusClass(p.status);
          st.textContent = String(p.status);
          top.appendChild(left);
          top.appendChild(st);

          var meta = document.createElement("div");
          meta.className = "req-meta";
          var dur = document.createElement("span");
          dur.textContent = (p.duration_ms ? p.duration_ms.toFixed(2) : "0.00") + " ms";
          var idSpan = document.createElement("span");
          idSpan.textContent = p.id;
          meta.appendChild(dur);
          meta.appendChild(idSpan);

          row.appendChild(top);
          row.appendChild(meta);
          row.addEventListener("click", function () {
            loadProfile(p.id);
          });
          listEl.appendChild(row);
        });
      }

      function renderDetail() {
        detailEl.textContent = "";
        if (!selected || !selected.sections || !selected.sections.length) {
          var emp = document.createElement("div");
          emp.className = "empty";
          emp.textContent = "Select a recorded request to inspect its profile.";
          detailEl.appendChild(emp);
          return;
        }
        if (!activeSection || !selected.sections.some(function (s) { return s.name === activeSection; })) {
          activeSection = selected.sections[0].name;
        }

        var tabs = document.createElement("div");
        tabs.className = "tabs";
        selected.sections.forEach(function (sec) {
          var t = document.createElement("div");
          t.className = "tab" + (sec.name === activeSection ? " active" : "");
          var tb = sec.toolbar || {};
          t.textContent = (tb.label || sec.name) + ": " + (tb.value || "");
          t.addEventListener("click", function () {
            activeSection = sec.name;
            renderDetail();
          });
          tabs.appendChild(t);
        });
        detailEl.appendChild(tabs);

        var sec = selected.sections.find(function (s) { return s.name === activeSection; });
        if (!sec || !sec.panel) return;
        (sec.panel.widgets || []).forEach(function (w) {
          if (w.title) {
            var wt = document.createElement("div");
            wt.className = "widget-title";
            wt.textContent = w.title;
            detailEl.appendChild(wt);
          }
          if (w.kind === "metrics" && w.metrics) {
            var mw = document.createElement("div");
            mw.className = "metrics";
            w.metrics.forEach(function (m) {
              var card = document.createElement("div");
              card.className = "metric";
              var l = document.createElement("div");
              l.className = "metric-label";
              l.textContent = m.label;
              var v = document.createElement("div");
              v.className = "metric-val";
              v.textContent = m.value;
              card.appendChild(l);
              card.appendChild(v);
              mw.appendChild(card);
            });
            detailEl.appendChild(mw);
          } else if (w.kind === "key_value" && w.pairs) {
            var tbl = document.createElement("table");
            Object.keys(w.pairs).forEach(function (k) {
              var tr = document.createElement("tr");
              var th = document.createElement("th");
              th.textContent = k;
              var td = document.createElement("td");
              td.textContent = w.pairs[k];
              tr.appendChild(th);
              tr.appendChild(td);
              tbl.appendChild(tr);
            });
            detailEl.appendChild(tbl);
          } else if (w.kind === "table" && w.rows) {
            var rTbl = document.createElement("table");
            if (w.columns && w.columns.length) {
              var trH = document.createElement("tr");
              w.columns.forEach(function (c) {
                var th = document.createElement("th");
                th.textContent = c;
                trH.appendChild(th);
              });
              rTbl.appendChild(trH);
            }
            w.rows.forEach(function (r) {
              var tr = document.createElement("tr");
              r.forEach(function (cell) {
                var td = document.createElement("td");
                td.textContent = cell;
                tr.appendChild(td);
              });
              rTbl.appendChild(tr);
            });
            detailEl.appendChild(rTbl);
          } else if (w.kind === "code" && w.code) {
            var pre = document.createElement("pre");
            pre.textContent = w.code;
            detailEl.appendChild(pre);
          }
        });
      }

      function loadProfile(id) {
        fetch(baseUrl + "/api/profiles/" + encodeURIComponent(id))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data) return;
            selected = data;
            renderList();
            renderDetail();
          });
      }

      function loadList() {
        fetch(baseUrl + "/api/profiles")
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (list) {
            profiles = Array.isArray(list) ? list : [];
            if (!selected && profiles.length) {
              loadProfile(profiles[0].id);
            } else {
              renderList();
            }
          });
      }

      filterEl.addEventListener("input", renderList);
      refreshBtn.addEventListener("click", loadList);
      loadList();
      setInterval(loadList, 3000);
    })();
  </script>
  <script src="{{BASE_URL}}/assets/toolbar.js" data-base-url="{{BASE_URL}}" defer></script>
</body>
</html>
